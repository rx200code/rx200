<html>
<head>
<meta http-equiv="content-type" content="text/html; charset=UTF-8">
<title>Множество Мандельброта</title>
<script type="text/javascript">


var view = new Object();
let width = 1000;
let height = 960;
let color = 0xFF;
let background = 0x00;
view.start = function(){
	this.color = "#e9e9e9";
	this.canvas = document.createElement('canvas');
	this.canvas.width = width;
	this.canvas.height = height;
	document.body.prepend(this.canvas);
	this.c = this.canvas.getContext('2d');
	
	this.imageData = this.c.createImageData(width, height);
	
	this.c.fillStyle = this.color;
	this.c.fillRect(0, 0, this.width, this.height);
	
	this.view = function(){
		
		
		for(let h = 0; h < height; h++){
			for(let w = 0; w < width; w++){
				// 1. Преобразуем коорднинаты.
				let x = w / 400 - 2;
				let y = h / 400 - 1.2;
				
				// 2. Проверяем координату.
				let z = 0;
				let z_i = 0;
				let result = 100;
				for(let i = 0; i < result; i++){
					if(z * z + z_i * z_i > 4){
						result = i;
						break;
					}
					let temp_z = z * z - z_i * z_i + x;
					z_i = 2 * z * z_i + y;
					z = temp_z;
				}
				
				let id = h * width * 4 + w * 4;
				if(result === 100){
					this.imageData.data[id + 0] = color;  // R value
					this.imageData.data[id + 1] = color;  // G value
					this.imageData.data[id + 2] = color;  // B value
					this.imageData.data[id + 3] = 0xFF;  // A value
				}else{
					this.imageData.data[id + 0] = background;  // R value
					this.imageData.data[id + 1] = background;  // G value
					this.imageData.data[id + 2] = background;  // B value
					this.imageData.data[id + 3] = 0xFF;  // A value
				}
			}
		}
		
		this.c.putImageData(this.imageData, 0, 0);
		
		
		out("test 1")
	}.bind(this);
	this.view();
	
}
window.onload = function(){
	view.start();
}
function out(text){
	document.getElementById("output").innerHTML=text;
}
</script>
</head>
<body>
<!--TEST-->
<br>
<span id="output"></span>
<!--TEST-->
</body>
</html>
