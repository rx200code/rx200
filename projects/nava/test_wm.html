// Функция для перевода географических координат объекта

function fromGeoToPixels (lat, long, projection, z) {
    var x_p, y_p,
        pixelCoords,
        tilenumber = [],
        rho,
        pi = Math.PI,
        beta,   
        phi,
        theta,
        e = projection.eccentricity;
 
    rho = Math.pow(2, z + 8) / 2;
    beta = lat * pi / 180;
    phi = (1 - e * Math.sin(beta)) / (1 + e * Math.sin(beta));
    theta = Math.tan(pi / 4 + beta / 2) * Math.pow(phi, e / 2);
    
    x_p = rho * (1 + long / 180);
    y_p = rho * (1 - Math.log(theta) / pi);
    
    return [x_p, y_p];
}

import math

def forward_mercator_wgs84(lon, lat):
    # Параметры WGS 84 (EPSG:7030)
    a = 6378137.0         
    f_inv = 298.257223563 
    f = 1 / f_inv
    e_squared = 2 * f - f**2 
    e = math.sqrt(e_squared) 

    # Перевод градусов в радианы
    phi = math.radians(lat)
    lambda_ = math.radians(lon)

    # X координата
    x = a * lambda_

    # Y координата (улучшенная, эллипсоидальная)
    # Используется изометрическая широта M(phi)
    
    # Расчет поправочного коэффициента (1 - e*sin(phi)) / (1 + e*sin(phi))
    e_term = (1.0 - e * math.sin(phi)) / (1.0 + e * math.sin(phi))
    
    # Итоговая формула Y
    y = a * math.log(math.tan(math.pi / 4.0 + phi / 2.0) * (e_term**(e/2.0)))
    
    return x, y
