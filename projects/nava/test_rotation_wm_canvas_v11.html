<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8" />
		<title>rotation WM</title>
		<style>
			#map{
				/**/
				overflow: hidden;
				/**/
				position: absolute;
				background-color: #888;
				outline: solid 2px #000;
				width: 1200px;
				height: 700px;
				left: 100px;
				top: 100px;
				margin: 0;
			}
			#map > img{
				position: absolute;
				/**
				vertical-align: bottom;
				/**/
				padding: 0;
				margin: 0;
				/**
				outline: solid 2px #F00;
				opacity: .5;
				/**/
				transform-origin: top left;
			}
			#map > canvas{
				position: absolute;
				/**
				vertical-align: bottom;
				/**/
				padding: 0;
				margin: 0;
				/**/
				outline: solid 2px #F00;
				/**/
				/**
				opacity: .5;
				/**/
				/**
				transform-origin: top left;
				/**/
			}
			/**
			#map > canvas{
				pointer-events: none; 
			}
			/**/
			#point_center{
				position: absolute;
				margin: 0;
				padding: 0;
				width: 0px;
				height: 0px;
				outline: solid 2px #F00;
			}
			#point_rot{
				position: absolute;
				margin: 0;
				padding: 0;
				width: 0px;
				height: 0px;
				outline: solid 2px #00F;
				
			}
			#point_out{
				position: absolute;
				margin: 0;
				padding: 0;
				width: 0px;
				height: 0px;
				outline: solid 2px #0F0;
			}
			
		</style>
		<script>
			// Константы PI
			const rad_180 = Math.PI;
			const rad_1 = rad_180 / 180;
			const rad_45 = rad_180 / 4;
			const rad_90 = rad_180 / 2;
			const rad_360 = rad_180 * 2;
			
			// Функции перевода радиан в градусы и обратно.
			let toRad = deg => deg * rad_1;
			let toDeg = rad => rad / rad_1;
			
			// Функции создания элементов HTML для вращения.
			let createElementNS = (name, ...attr) => {
				let elm = document.createElementNS("http://www.w3.org/2000/svg", name);
				for(let arr_set of attr)elm.setAttributeNS(null, arr_set[0], arr_set[1]);
				return elm;
			};
			let createElement = (name, ...attr) => {
				let elm = document.createElement(name);
				for(let arr_set of attr)elm.setAttribute(arr_set[0], arr_set[1]);
				return elm;
			};
			let m_down = (e, f, f2) => {
				e.preventDefault();
				let onMouseUp = e => {
					if(f2 !== undefined)f2(e);
					document.removeEventListener('mouseup', onMouseUp);
					document.removeEventListener('mousemove', f);
				};
				document.addEventListener('mousemove', f);
				document.addEventListener('mouseup', onMouseUp);
			};
			let create_input_a = (f, a = 0) => {
				let w = 140;
				let w_2 = w / 2;
				let r = w_2 - 2;
				let elm = createElementNS("svg", ["style", "margin: -9px 0px 0px 0px; width: "+(w * 2)+"px; height: "+w+"px; float: right;"]);
				elm.appendChild(createElementNS("circle", ["cx", w_2], ["cy", w_2], ["r", r], ["fill", "none"], ["stroke", "#000"], ["pointer-events", "none"]));
				let arrow = createElementNS("path", ["d", "M"+w_2+","+w_2+"v-"+r], ["fill", "none"], ["stroke", "#555"], ["pointer-events", "none"]);
				elm.appendChild(arrow);
				let arrow_r = createElementNS("path", ["fill", "none"], ["stroke", "#ff5050"], ["pointer-events", "none"]);
				elm.appendChild(arrow_r);
				let w_x, w_y;
				let text = createElementNS("text", ["x", w + 2], ["y", w_2 + 3], ["font-size", 14], ["pointer-events", "none"]);
				text.textContent = "0";
				elm.appendChild(text);
				elm.onmousemove = e => {
					let a = Math.atan2(e.offsetX - w_2, w_2 - e.offsetY);
					text.textContent = Math.round(toDeg(a));
					arrow_r.setAttributeNS(null, "d", "M"+w_2+","+w_2+"l"+(Math.sin(a) * r)+","+(Math.cos(a) * -r));
				};
				elm.onmouseleave = e => {
					arrow_r.setAttributeNS(null, "d", "");
					text.textContent = Math.round(toDeg(a));
				};
				elm.onmousedown = e => {
					w_x = w_2 - e.offsetX + e.pageX;w_y = w_2 - e.offsetY + e.pageY;
					m_down(e, e => {
						a = Math.atan2(e.pageX - w_x, w_y - e.pageY);
						text.textContent = Math.round(toDeg(a));
						arrow_r.setAttributeNS(null, "d", "M"+w_2+","+w_2+"l"+(Math.sin(a) * r)+","+(Math.cos(a) * -r));
						f(a);
					}, e => {
						a = Math.atan2(e.pageX - w_x, w_y - e.pageY);
						text.textContent = Math.round(toDeg(a));
						arrow_r.setAttributeNS(null, "d", "");
						arrow.setAttributeNS(null, "d", "M"+w_2+","+w_2+"l"+(Math.sin(a) * r)+","+(Math.cos(a) * -r));f(a);
					});
				};
				elm.f_a = _a => {
					a = _a;
					text.textContent = Math.round(toDeg(a));
					arrow.setAttributeNS(null, "d", "M"+w_2+","+w_2+"l"+(Math.sin(a) * r)+","+(Math.cos(a) * -r));
					f(a);
				};
				return elm;
			};
			
			const tile_size = 256;
			
			const canvas_img = createElement("canvas", ["width", tile_size], ["height", tile_size]);
			const ctx_img = canvas_img.getContext("2d");
			ctx_img.strokeStyle = "#000";
			ctx_img.fillStyle = "#fff";
			ctx_img.font = "28px serif";
			ctx_img.textAlign = "center";
			ctx_img.textBaseline = "middle";
			
			function getSrcBlobBase64(url){
				//return url;// Закоментируйте для отображения номеров тайлов из псевдо сервера. // Не кешируется браузером.
				let numbers = url.match(/\d+/g);
				let y = numbers.pop();
				let x = numbers.pop();
				let z = numbers.pop();
				
				//ctx_img.clearRect(0, 0, tile_size, tile_size);
				/**/
				ctx_img.fillStyle = "#888";
				ctx_img.fillRect(0, 0, tile_size, tile_size);
				ctx_img.fillStyle = "#fff";
				/**/
				ctx_img.strokeRect(0, 0, tile_size, tile_size);
				
				ctx_img.setLineDash([4, 16]);
				
				ctx_img.moveTo(0, 0);
				ctx_img.lineTo(tile_size, tile_size);
				ctx_img.moveTo(tile_size, 0);
				ctx_img.lineTo(0, tile_size);
				ctx_img.stroke();
				
				ctx_img.setLineDash([0, 0]);
				
				ctx_img.fillText(x, tile_size / 2, 50);
				ctx_img.fillText(y, tile_size - 50, tile_size / 2);
				ctx_img.fillText(z, 50, tile_size / 2);
				
				return canvas_img.toDataURL();
			}

			/** Начальные константы переменные карты. */
			// Начальные координаты, широты и долготы.
			
			let lat = 55;// Широта
			let lon = 83;// Долгота
			let lat_rad = toRad(lat);// Широта в радианах
			let zoom = 0;// уровень зума
			
			//let half_length_WM = 1 << (zoom - 1);// половина длины Веб меркатора в тайлах(tile = 1), Math.log2(tile) = 0;
			let half_length_WM = 2 ** (zoom - 1);
			let radius_WM = half_length_WM / rad_180;// Радиус веб меркатора, если считать длину в количестве тайлов на сторону.
			
			// Функции перевода в Веб меркатор и обратно.
			let getY = lat_rad => half_length_WM - radius_WM * Math.log(Math.tan(rad_45 + lat_rad / 2));// получает Y Веб Меркатора исходя из широты в радианах.
			let getLatRad = y => 2 * Math.atan(Math.exp((half_length_WM - y) / radius_WM)) - rad_90;// обратная getY()
			let getX = lon => (lon / 180 + 1) * half_length_WM;// не используем lon_rad, так как достаточно и lon в градусах.
			let getLon = x => (x / half_length_WM - 1) * 180;// обратная getX()
			
			// минимальные и максимальные значения для широты, долготы и зума.
			const lat_min = -85.0511287;//Более точное значение -85.0511287798065822585;
			const lat_max = 85.0511287;//Более точное значение 85.0511287798065822585;
			const lon_min = -180;
			const lon_max = 180;
			const zoom_min = 0;
			const zoom_max = 18;
			
			// Координаты центра в X, Y для заданного размера тайла.
			let center_x = getX(lon);
			let center_y = getY(lat_rad);
			
			let tile = 256;// int
			// Координаты точки вращения.
			let rot_x = center_x | 0;// Правая сторона тайла.
			let rot_y = center_y | 0;// Верх тайла.
			
			// минимальные и максимальные значения для x, y, tile.
			const x_min = 0;
			const y_min = 0;
			const tile_min = 1;
			let x_max = 2 ** zoom - 1;//131071;// 2 ** 17 - 1;// (1 << zoom) - 1;
			let y_max = x_max;
			
			let a_view = toRad(-0);// Угол поворота окна карты, относительно карты(отрицательный угол поворота карты).
			let sin_a_view = Math.sin(a_view);
			let cos_a_view = Math.cos(a_view);

			const subdomains = ["a.","b.","c.",""];// поддомены.
			const subdomain_mask = 3;// Маска поддомена.
			
			let elm_view, elm_point_center, elm_point_rot, elm_point_out;
			let top_elm_view, left_elm_view, width_elm_view, height_elm_view, center_x_elm_view, center_y_elm_view, rot_x_elm_view, rot_y_elm_view;
			let center_x_elm_view_absolute, center_y_elm_view_absolute, rot_x_elm_view_absolute, rot_y_elm_view_absolute;
			let canvas, ctx, size_elm_canvas, canvas_center_xy, canvas_x_offset, canvas_y_offset;
			let center_to_pivot_x, center_to_pivot_y;
			let canvas_buffer, ctx_buffer;
			let width_view_tile, height_view_tile, center_x_view_tile, center_y_view_tile;
			window.onload = () => {
				// Вспомогательный элемент для вращения карты и вывода угла.
				let elm_input_a = document.getElementById("out_a");
				elm_input_a.onclick = function(){this.select();};
				elm_input_a.value = 0;
				let elm_a = create_input_a((a) => {
					rot_map(a);
					out_a(toDeg(a));
				});
				elm_input_a.onchange = function(){elm_a.f_a(toRad(this.value));};
				document.body.appendChild(elm_a);
				
				/** УСТАНОВКА КАРТЫ и констант окна, при изменении размеров окна карты их нужно переопределять */
				
				elm_view = document.getElementById("map");// Окно карты
				// определяем размеры окна просмотра карты.
				let rect_elm_view = elm_view.getBoundingClientRect();
				top_elm_view = rect_elm_view.top;// Положение окна карты по y
				left_elm_view = rect_elm_view.left;// Положение окна карты по x
				width_elm_view = rect_elm_view.width;// Ширена окна карты
				height_elm_view = rect_elm_view.height;// Высота окна карты
				center_x_elm_view = width_elm_view / 2;// Смещение центра карты относительно окна по оси x
				center_y_elm_view = height_elm_view / 2;// Смещение центра карты относительно окна по оси y
				
				width_view_tile = width_elm_view / tile;// Ширена окна карты в тайлах веб меркатора
				height_view_tile = height_elm_view / tile;;// Высота окна карты в тайлах веб меркатора
				center_x_view_tile = width_view_tile / 2;;// Смещение центра карты в тайлах веб меркатора относительно окна по оси x
				center_y_view_tile = height_view_tile / 2;// Смещение центра карты в тайлах веб меркатора относительно окна по оси y
				
				// Точка вращения.
				rot_x_elm_view = center_x_elm_view + ((rot_x - center_x) * tile);// Положение точки вращения относительно окна карты по x
				rot_y_elm_view = center_y_elm_view + ((rot_y - center_y) * tile);// Положение точки вращения относительно окна карты по y
				
				center_to_pivot_x = (rot_x_elm_view - center_x_elm_view) / tile;// Положение точки вращения относительно центра окна в тайлах по x
				center_to_pivot_y = (rot_y_elm_view - center_y_elm_view) / tile;// Положение точки вращения относительно центра окна в тайлах по y
				
				// Вспомогательные константы положения центра и точки вращения относительно окна всей страницы.
				center_x_elm_view_absolute = left_elm_view + center_x_elm_view;
				center_y_elm_view_absolute = top_elm_view + center_y_elm_view;
				rot_x_elm_view_absolute = left_elm_view + rot_x_elm_view;
				rot_y_elm_view_absolute = top_elm_view + rot_y_elm_view;
				
				out(rot_x_elm_view_absolute +" | "+rot_y_elm_view_absolute);
				
				// ДЛЯ НАГЛЯДНОСТИ Вспомогательные элементы отображения(точки), центра и точки вращения.
				elm_point_center = document.getElementById("point_center");
				elm_point_center.style.left = Math.round(center_x_elm_view_absolute) + 'px';
				elm_point_center.style.top = Math.round(center_y_elm_view_absolute) + 'px';
				
				elm_point_rot = document.getElementById("point_rot");
				elm_point_rot.style.left = Math.round(rot_x_elm_view_absolute) + 'px';
				elm_point_rot.style.top = Math.round(rot_y_elm_view_absolute) + 'px';
				
				/** Вспомогательная точка для тестов. */
				elm_point_out = document.getElementById("point_out");
				elm_point_out.style.left = 0 + 'px';
				elm_point_out.style.top = 0 + 'px';
				/**/
				
				/** БУФЕРЫ canvas для плавного и безшовного отображения загрузки и вращения тайлов карты */
				size_elm_canvas = Math.ceil((width_elm_view ** 2 + height_elm_view ** 2) ** .5);// Ширена и высота буферов равна диагонали окна карты.
				canvas_center_xy = size_elm_canvas / 2;// Центер буферов карты по (x) и по (y)
				canvas_x_offset = canvas_center_xy - center_x_elm_view;// Начальное смещение положения буферов за пределы окна карты по x
				canvas_y_offset = canvas_center_xy - center_y_elm_view;// Начальное смещение положения буферов за пределы окна карты по y
				
				canvas = createElement("canvas", ["width", size_elm_canvas], ["height", size_elm_canvas]);// БУФЕР 1 изначально отображаемый.
				canvas.style.left = -canvas_x_offset + 'px';
				canvas.style.top = -canvas_y_offset + 'px';
				canvas.style.pointerEvents = 'none';
				ctx = canvas.getContext("2d");
				ctx.fillStyle = "#888";
				elm_view.appendChild(canvas);
				
				canvas_buffer = createElement("canvas", ["width", size_elm_canvas], ["height", size_elm_canvas]);// БУФЕР 2
				canvas_buffer.style.left = -canvas_x_offset + 'px';
				canvas_buffer.style.top = -canvas_y_offset + 'px';
				canvas_buffer.style.pointerEvents = 'none';
				canvas_buffer.style.opacity = '0';
				ctx_buffer = canvas_buffer.getContext("2d");
				ctx_buffer.fillStyle = "#888";
				elm_view.appendChild(canvas_buffer);
				
				
				
				// Начальное заполнение тайлов.
				//rot_map(-a_view);
				elm_a.f_a(-a_view);
				
				// Устанавливаем функцию задающую точку вращения по клику
				elm_view.onclick = e => {
					// Устанавливаем для наглядности.
					elm_point_rot.style.left = e.clientX + 'px';
					elm_point_rot.style.top = e.clientY + 'px';
					// Нужно для тестов, скорее всего не понадобится абсолютное значение.
					rot_x_elm_view_absolute = e.clientX;
					rot_y_elm_view_absolute = e.clientY;
					
					/** Код вычислений */
					// Положение точки вращения относительно координат экрана карты DIV. (DIV с id="map") #map > * {pointer-events: none;}// для того чтоб offsetX было относительно экрана карты.
					rot_x_elm_view = e.offsetX;
					rot_y_elm_view = e.offsetY;
					
					// Смещение точки вращения относительно центра в тайлах.
					center_to_pivot_x = (rot_x_elm_view - center_x_elm_view) / tile;
					center_to_pivot_y = (rot_y_elm_view - center_y_elm_view) / tile;
					
					// Точка вращения в тайлах веб меркатора.
					rot_x = center_to_pivot_x * cos_a_view - center_to_pivot_y * sin_a_view + center_x;
					rot_y = center_to_pivot_x * sin_a_view + center_to_pivot_y * cos_a_view + center_y;
					
					// вывод для информации. 
					out("Широта, Долгота: " + toDeg(getLatRad(rot_y)) + ", " + getLon(rot_x) + " | y, x: " + rot_y + ", " + rot_x);
					/**/
				};
				elm_view.onmousedown = e => {// ПРОБНЫЙ ВАРИАНТ для тестов
					m_down(e, e => {
						let move_x = e.movementX / tile;
						let move_y = e.movementY / tile;
						
						center_x -= move_x * cos_a_view - move_y * sin_a_view;
						center_y -= move_x * sin_a_view + move_y * cos_a_view;
						
						rot_x = center_to_pivot_x * cos_a_view - center_to_pivot_y * sin_a_view + center_x;
						rot_y = center_to_pivot_x * sin_a_view + center_to_pivot_y * cos_a_view + center_y;
						
						rot_map(-a_view);
					});
				};
				elm_view.onwheel = e => {// ПРОБНЫЙ ВАРИАНТ? для тестов
					//Масштабирует относительно центра окна карты.
					
					let temp_x = center_x / half_length_WM;
					let temp_y = (half_length_WM - center_y) / radius_WM;
					
					zoom -= Math.sign(e.deltaY);//Для совместимости браузеров, от дельты берем только знак.
					
					if(zoom < zoom_min)zoom = zoom_min;
					else if(zoom > zoom_max)zoom = zoom_max;
					
					//half_length_WM = 1 << (zoom - 1);// половина длины Веб меркатора в тайлах(tile = 1), Math.log2(tile) = 0;
					half_length_WM = 2 ** (zoom - 1);// половина длины Веб меркатора в тайлах(tile = 1), Math.log2(tile) = 0;
					radius_WM = half_length_WM / rad_180;// Радиус веб меркатора, если считать длину в количестве тайлов на сторону.
					x_max = 2 ** zoom - 1;//131071;// 2 ** 17 - 1;// (1 << zoom) - 1;
					y_max = x_max;
					
					center_x = temp_x * half_length_WM;
					center_y = half_length_WM - temp_y * radius_WM;
					
					rot_x = center_to_pivot_x * cos_a_view - center_to_pivot_y * sin_a_view + center_x;
					rot_y = center_to_pivot_x * sin_a_view + center_to_pivot_y * cos_a_view + center_y;
					
					rot_map(-a_view);
				};
				
			}
			
			let test_flag_1 = false;// С флагом похоже работает идеально. Наверно нужно добавить ещё лимит по времени загрузки.
			
			function rot_map(a){
				if(test_flag_1)return;
				test_flag_1 = true;
				/** ФУНКЦИЯ ВРАЩЕНИЯ КАРТЫ (ВРАЩЕНИЯ ОКНА ОТОБРАЖЕНИЯ КАРТЫ) **/
				/**
				
				За размер плитки принята еденица(tile_size = 1), а не 256, так удобнее считать сразу в системе координат плиток.
				/**/
				// !!! ДОДЕЛАТЬ !!!, если угол равен нулю(0 === -0), то вывести в быстрый расчет, и убрать у тангенса проверку на ноль.
				
				a_view = -a;// Всё относительно, если карта вращается в одну сторону, то экран относительно карты в противоположенную.
				sin_a_view = Math.sin(a_view);
				cos_a_view = Math.cos(a_view);
				
				// Устанавливаем положение нового центра
				center_x = rot_x + (center_to_pivot_y * sin_a_view - center_to_pivot_x * cos_a_view);
				center_y = rot_y - (center_to_pivot_y * cos_a_view + center_to_pivot_x * sin_a_view);
				
				//out(center_x + " | " + center_y + " | " + rot_x + " | " + rot_y);
				
				/** НАЧИНАЕМ РАСЧЕТЫ ОТНОСИТЕЛЬНО НОВОГО ЦЕНТРА. **/
				///////// ПРЕОБРАЗОВАННЫЙ СТАРЫЙ АЛГОРИТМ //////////
				
				let size_left_border, size_right_border;// относительно координат тайлов(плиток), размер левой и правой стороны окна карты

						sin_a = sin_a_view;// ТАКЖЕ СТОИТ УЧЕСТЬ в javascript, как и в большинстве других языков, Math.sin(x) возвращает 0 только для x = 0, и (0 четверть) единственный случай.

				let tan_a = sin_a / cos_a;// Тангенс, относительно верхнего угла экрана в системе координат тайлов
				let cot_a = 1 / tan_a;// Котангенс.
				
				let left_shift_h = size_left_border * cos_a;// размер левой стороны дисплея по оси y
				let right_shift_h = size_right_border * sin_a;// размер правой стороны дисплея по оси y
				
				// координаты верхнего угла окна карты, в системе координат плиток.
				let x_top_corner = left_offset * cos_a_view + top_offset * sin_a_view + center_x;

				//let tile_y = y_top_corner | 0;// ряд верхней плитки дисплея.// tile_y = tile_top;

				let tile_bottom = Math.floor(y_top_corner + left_shift_h + right_shift_h);
				
				out(tile_y + " | " + tile_bottom);
				
				let l_min = x_top_corner - size_left_border * sin_a;// минимальная координата дисплея по оси x
				let r_max = x_top_corner + size_right_border * cos_a;// максимальная координата дисплея по оси x
				
				let shift_y_tile = 1 - y_top_corner % 1;// смещение верхнего угла дисплея относительно плитки по оси y
				
				let l_pos = x_top_corner - shift_y_tile * tan_a;// левая позиция в ряде.
				let r_pos = x_top_corner + shift_y_tile / tan_a;// правая позиция в ряде.
				
				let r_corner_offset = (1 - (y_top_corner + left_shift_h) % 1) / tan_a;// смещение по оси x на один ряд, относительно левого угла дисплея с левой стороны в право
				let l_corner_offset = ((y_top_corner + right_shift_h) % 1 - 1) * tan_a;// смещение по оси x на один ряд, относительно правого угла дисплея с правой стороны в лево // l_corner_offset = -l_2;
				
				let l_shift = -tan_a;// смещение левой позиции в ряде, относительно позиции в предыдущем ряде.
				let r_shift = cot_a;// смещение правой позиции в ряде, относительно позиции в предыдущем ряде.
				let flag_l = false;// флаг достижения левого края дисплея и смены направления
				let flag_r = false;// флаг достижения правого края дисплея и смены направления
				
				
				
				while(tile_y <= tile_bottom){
					
					if(l_pos < l_min){// если достигнут левый край экрана
						l_pos = l_min;
						l_shift = r_corner_offset;
						flag_l = true;
					}
					if(r_pos > r_max){// если достигнут правый край экрана
						r_pos = r_max;
						r_shift = l_corner_offset;
						flag_r = true;
					}
					
					//let l_tile = l_pos | 0;// номер левой плитки
					//let r_tile = r_pos | 0;// номер правой плитки
					let l_tile = Math.floor(l_pos);

					//alert(tile_y + " | " + l_tile + " | " + r_pos);
					
					//if(tile_y >= 0)alert(l_tile + " " + r_pos);
					
					while(l_tile <= r_tile)test_append_elm_v3(l_tile++, tile_y);
					++tile_y;
					
					l_pos += l_shift;
					r_pos += r_shift;
					
					//alert(l_shift + " | " + r_shift + " | " + l_tile + " | " + r_pos);
					
					//if(tile_y === 1)alert(l_tile + " " + r_pos);
					if(flag_l){
						l_shift = cot_a;
						flag_l = false;
					}
					if(flag_r){
						r_shift = -tan_a;
						flag_r = false;
					}
				}
				
				test_444++;

				/** КОНЕЦ РАСЧЕТОВ ОТНОСИТЕЛЬНО ЦЕНТРА */
				count_test_2++;
