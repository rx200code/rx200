<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8" />
		<title>Map gen</title>
		<style>
			#main_view{
				/**
				position: relative;
				/**/
				position: fixed;
				padding: 0;
				margin: 0;
				background-color: #888;
				border: solid 2px #000;
				width: 700px;
				height: 550px;
				float: left;
			}
			h3, h2{
				margin: 0;
			}
			#simplex_scale_factor{
				width: 150px;
			}
			#block{
				margin-left: 710px;
			}
			#current_time{
				width: 500px;
			}
		</style>
		<!----
		<script src="noise.js"></script>
		<!---->
		<script>
			//####### Вспомогательные функции #######
			let createElement = (name, ...attr) => {
				let elm = document.createElement(name);
				for(let arr_set of attr)elm.setAttribute(arr_set[0], arr_set[1]);
				return elm;
			};

			// 0. Функция рандома. Быстрый генератор случайных. от 0 до 1 не включая 1.
			let seed = 0x77777777;//(Math.random() * 0x100000000) >>> 0;//0x77777777;
			let random = () => (seed = (seed * 1664525 + 1013904223) % 4294967296) / 4294967296;

			// Шум
			// 1. Базовый шум Перлина.
			// 1.1 инициализация permutation, для установки своего seed вынесена в init_permutation.
			const permutation = new Uint8Array(512);
			let init_permutation = () => {
				for(let i = 0; i < 256; i++)permutation[i] = i;
				// Быстрое тасование Фишера-Йетса
				for(let i = 255; i > 0; i--){
					const j = (random() * (i + 1)) | 0;
					const temp = permutation[i];
					permutation[i] = permutation[j];
					permutation[j] = temp;
				}
				for(let i = 0; i < 256; i++){
					permutation[i + 256] = permutation[i];
				}
			};
			init_permutation();
			// Функция сглаживания Кэна Перлина (Smootherstep: 6t⁵ - 15t⁴ + 10t³)
			let fade = t => t * t * t * (t * (t * 6 - 15) + 10);
			//let fade = t => t * t * (3 - 2 * t);
			//let fade = t => 1 - Math.abs(1 - 2 * t);
			//let fade = t => Math.sqrt(1 - (2 * t - 1) * (2 * t - 1));
			//let fade = t => Math.pow(t, 1/3);
			//let fade = t => 1.0 - 4.0 * (t - 0.5) * (t - 0.5); 
			//let fade = t => t;
			// Линейная интерполяция (Lerp)
			let lerp = (t, a, b) => a + t * (b - a);
			let grad = (hash, x, y) => {
				const h = hash & 3;
				const u = h < 2 ? x : -x;
				const v = (h === 0 || h === 2) ? y : -y;
				return u + v;
			};
			// 1. Базовый шум Перлина (возвращает от 0.0 до 1.0)
			let noise2D = (x, y) => {
				const xInt = Math.floor(x);
				const yInt = Math.floor(y);

				let X = xInt & 255;
				let Y = yInt & 255;

				x -= xInt;
				y -= yInt;

				const u = fade(x);
				const v = fade(y);

				const p = permutation;
				const aa = p[p[X] + Y];
				const ab = p[p[X] + Y + 1];
				const ba = p[p[X + 1] + Y];
				const bb = p[p[X + 1] + Y + 1];

				const x1 = lerp(u, grad(aa, x, y), grad(ba, x - 1, y));
				const x2 = lerp(u, grad(ab, x, y - 1), grad(bb, x - 1, y - 1));

				const val = lerp(v, x1, x2);
				return (val + 1.0) / 2.0;
			};

			//#######################################


			// Константы переменные.
			// Пространство Время.
			const SPACE_WIDTH = 0xFFFFFFFF;// x
			const SPACE_HEIGHT = 0xFFFFFFFF;// y
			const SPACE_DEPTH = 0xFFFFFFFF;// z
			const SPACE_TIME = 0xFFFFFFFF;// t

			const MIN_WIDTH = -0x80000000;// x
			const MIN_HEIGHT = -0x80000000;// y
			const MIN_DEPTH = -0x80000000;// z
			const MIN_TIME = 0x0;// t

			const MAX_WIDTH = 0x7FFFFFFF;// x
			const MAX_HEIGHT = 0x7FFFFFFF;// y
			const MAX_DEPTH = 0x7FFFFFFF;// z
			const MAX_TIME = 0xFFFFFFFF;// t

			// Ширина и Высота отображения в пикселях.
			const CANVAS_W = 700;
			const CANVAS_H = 500;

			// Масштаб
			const MAX_SCALE = SPACE_WIDTH / CANVAS_H;
			const MIN_SCALE = 1 / 50;// одно поле / пикселей.

			// Стартовые значения координат время.
			let scale = .02;
			let right_x = CANVAS_W / 2 * scale;
			let top_y = CANVAS_H / 2 * scale;
			let current_t = 0;
			
			
			// Константы переменные Канвас.
			let container;
			let canvas = createElement('canvas');
			let ctx = canvas.getContext('2d');
			ctx.imageSmoothingEnabled = false;// Отключаем сглаживание
			canvas.width = CANVAS_W;
			canvas.height = CANVAS_H;
			
			let view_data = ctx.createImageData(CANVAS_W, CANVAS_H);
			let buf_32 = new Uint32Array(view_data.data.buffer);
			let buf_32_lenhth = buf_32.length;
			
			
			window.onload = () => {
				
				document.getElementById("current_time").value = current_t;
				container = document.getElementById("main_view");
				
				container.width = CANVAS_W;
				container.height = CANVAS_H;
				container.style.width = CANVAS_W + 'px';
				container.style.height = CANVAS_H + 'px';
				container.style.padding = '0';
				container.style.margin = '0';

				container.innerHTML = '';
				container.appendChild(canvas);
				document.getElementById("block").style.marginLeft = (CANVAS_W + 10) + 'px';
				
				let isDragging = false;

				canvas.addEventListener('mousedown', (e) => {
					isDragging = true;
				});

				canvas.addEventListener('mousemove', (e) => {
					if(!isDragging){
						info("x: " + (right_x - e.offsetX * scale) + "<br>y: " + (top_y - e.offsetY * scale));
						//out("right_x: " + (right_x) + "<br>top_y: " + (top_y));
						return;
					}
					right_x += e.movementX * scale;
					top_y += e.movementY * scale;
					drawScene();
				});

				canvas.addEventListener('mouseup', () => {
					isDragging = false;
				});
				canvas.addEventListener('mouseleave', () => {
					isDragging = false;
				});
				
				canvas.addEventListener('wheel', (e) => {
					e.preventDefault();
					let temp_scale = scale;
					scale *= e.deltaY < 0 ? .8: 1.2;
					if(scale < MIN_SCALE)scale = MIN_SCALE;
					else if(scale > MAX_SCALE)scale = MAX_SCALE;

					temp_scale -= scale;
					right_x -= e.offsetX * temp_scale;
					top_y -= e.offsetY * temp_scale;

					out(scale);

					drawScene();
				}, { passive: false });
				
				
				drawScene();
				
			};

			let draw_view_data = () => {// Рисуем в буфер. ABGR.
				for(let y = 0; y < CANVAS_H; y++){
					for(let x = 0; x < CANVAS_W; x++){
						let dx = right_x - x * scale;
						let dy = top_y - y * scale;
						
						if(dx > MAX_WIDTH || dx < MIN_WIDTH || dy > MAX_HEIGHT || dy <MIN_HEIGHT){
							buf_32[y * CANVAS_W + x] = 0xFFAA0000;
						}else{
							let c = noise2D(dx, dy);
							
							c *= 0xFF;
							c &= 0xFF;
							buf_32[y * CANVAS_W + x] = 0xFF000000 | (c << 16) | (c << 8) | c;
						}
					}
				}
				
			};

			function drawScene(){
				draw_view_data();
				ctx.putImageData(view_data, 0, 0);
			}

			function test(){
				let test = "test";
				out(test);
			}
			function out(text){
				document.getElementById("out").innerHTML = text;
			}
			function info(text){
				document.getElementById("info").innerHTML = text;
			}
		</script>
	</head>
	<body>
		<div id="main_view"></div>
		<div id="block">
			<input type="button" onclick="test()" value="test" />
			<br>
			<input type="range" id="current_time" oninput="f_c(this.valueAsNumber)" min="0" max="360" step="1" value="0">
			<br>
			<span id="info">info</span>
			<br>
			<span id="out">out</span>
		</div>
	</body>
</html>
