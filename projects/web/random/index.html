<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8" />
		<title>test random</title>
		<style>
			#test_random{
				position: relative;
				padding: 0;
				margin: 0;
				background-color: #888;
				border: solid 2px #000;
				width: 1000px;
				height: 500px;
			}
		</style>
		<script src="random.js"></script>
		<script>
			// Вспомогательные функции
			let createElement = (name, ...attr) => {
				let elm = document.createElement(name);
				for(let arr_set of attr)elm.setAttribute(arr_set[0], arr_set[1]);
				return elm;
			};
			// Константы переменные.
			let container;
			let canvas;
			let ctx;
			let innerWidth, innerHeight;
			let mouse_x, mouse_y;
			let view_w = 256;
			let view_h = 256;
			let view_x = 372;
			let view_y = 122;
			let view_z = 1;
			let view_canvas;
			let view_ctx;
			let view_data;
			let buf_32;
			let input_count_random;
			let count_random = 100000;
			function init_view(){
				input_count_random = document.getElementById('count_random');
				input_count_random.value = count_random;
				input_count_random.oninput = e => {
					count_random = parseInt(e.target.valueAsNumber) || 0;
					if(count_random <= 0)e.target.value = count_random = 0;
				};
				view_canvas = createElement('canvas');
				view_canvas.width = view_w;
				view_canvas.height = view_h;
				view_ctx = view_canvas.getContext('2d');
				view_data = view_ctx.createImageData(view_w, view_h);
				buf_32 = new Uint32Array(view_data.data.buffer);

				for(let i = 0; i < buf_32.length; i++){
					// Записываем пиксель в формате ABGR
					buf_32[i] = 0xFF000000;
				}

				for(let i = 0; i < count_random; i++){
					// Записываем пиксель в формате ABGR
					let x = getRandomInt(view_w - 1);
					let y = getRandomInt(view_h - 1);
					let n = buf_32[y * view_w + x] & 0xFF;
					n += 0x22;
					if(n > 0xFF)n = 0xFF;
					buf_32[y * view_w + x] = 0xFF000000 | (n << 16) | (n << 8) | n;
				}

				view_ctx.putImageData(view_data, 0, 0, 0, 0, view_w, view_h);
				out("Равномерное распределение " + count_random + " точек. функциепй getRandomInt.");
			}
			window.onload = () => {
				init_view();
				container = document.getElementById("test_random");
				innerWidth = container.clientWidth;
				innerHeight = container.clientHeight;
				
				canvas = createElement('canvas', ['style', 'width:100%;height:100%;display:block;']);
				canvas.width = innerWidth;
				canvas.height = innerHeight;

				container.innerHTML = '';
				container.appendChild(canvas);

				ctx = canvas.getContext('2d');
				ctx.imageSmoothingEnabled = false;// Отключаем сглаживание

				let offsetX, offsetY, isDragging = false;

				canvas.addEventListener('mousedown', (e) => {
					isDragging = true;
					offsetX = e.clientX;
					offsetY = e.clientY;
					
				});

				canvas.addEventListener('mousemove', (e) => {
					if (!isDragging) return;

					view_x += e.movementX;
					view_y += e.movementY;
					drawScene();
				});

				canvas.addEventListener('mouseup', () => {
					isDragging = false;
				});
				canvas.addEventListener('mouseleave', () => {
					isDragging = false;
				});

				canvas.addEventListener('wheel', (e) => {
					//view_z *= e.deltaY < 0 ? .9: 1.1;
					let temp_z = view_z;
					view_z += e.deltaY < 0 ? 1: -1;
					if(view_z < 1)view_z = 1;
					else if(view_z > 20)view_z = 20;

					let offsetX = e.offsetX - view_x;
					let offsetY = e.offsetY - view_y;

					temp_z = view_z / temp_z;

					offsetX *= temp_z;
					offsetY *= temp_z;

					view_x = e.offsetX - offsetX;
					view_y = e.offsetY - offsetY;

					drawScene();
				}, { passive: false });

				drawScene();
				info("Холст: " + view_w + " x " + view_h + ".");
			};

			function drawScene(){
				ctx.fillStyle = '#87CEFA';
				ctx.fillRect(0, 0, innerWidth, innerHeight);

				ctx.drawImage(view_canvas, 0, 0, view_w, view_h, view_x, view_y, view_w * view_z, view_h * view_z);
			}

			function random(){
				for(let i = 0; i < buf_32.length; i++){
					// Записываем пиксель в формате ABGR
					buf_32[i] = 0xFF000000;
				}

				for(let i = 0; i < count_random; i++){
					// Записываем пиксель в формате ABGR
					let x = getRandomInt(view_w - 1);
					let y = getRandomInt(view_h - 1);
					let n = buf_32[y * view_w + x] & 0xFF;
					n += 0x22;
					if(n > 0xFF)n = 0xFF;
					buf_32[y * view_w + x] = 0xFF000000 | (n << 16) | (n << 8) | n;
				}

				view_ctx.putImageData(view_data, 0, 0, 0, 0, view_w, view_h);
				drawScene();
				out("Равномерное распределение " + count_random + " точек. функцией getRandomInt.");
			}

			function fast_random(){
				for(let i = 0; i < buf_32.length; i++){
					// Записываем пиксель в формате ABGR
					buf_32[i] = 0xFF000000;
				}

				//seed = 0x77777777;// Для сохранениЯ последовательности.
				for(let i = 0; i < count_random; i++){
					// Записываем пиксель в формате ABGR
					let x = fastRandomInt(view_w - 1);
					let y = fastRandomInt(view_h - 1);
					let n = buf_32[y * view_w + x] & 0xFF;
					n += 0x22;
					if(n > 0xFF)n = 0xFF;
					buf_32[y * view_w + x] = 0xFF000000 | (n << 16) | (n << 8) | n;
				}

				view_ctx.putImageData(view_data, 0, 0, 0, 0, view_w, view_h);
				drawScene();
				out("Равномерное распределение " + count_random + " точек, функцией fastRandomInt с сохранением последовательности(от seed).");
			}

			function random_f_normal_v1(){
				for(let i = 0; i < buf_32.length; i++){
					// Записываем пиксель в формате ABGR
					buf_32[i] = 0xFF000000;
				}

				//seed = 0x77777777;// Для сохранениЯ последовательности.
				random_density_f_x.init(f_normal_v1, -3, 3, view_w);//от -3 до 3 пик в 0
				for(let i = 0; i < count_random; i++){
					let x = random_density_f_x();
					let y = fastRandomInt(view_h - 1);
					let n = buf_32[y * view_w + x] & 0xFF;
					n += 0x22;
					if(n > 0xFF)n = 0xFF;
					buf_32[y * view_w + x] = 0xFF000000 | (n << 16) | (n << 8) | n;
				}

				for(let x = 0; x < view_w; x++){
					//от -3 до 3 пик в 0
					let y = view_h - (f_normal_v1((x / view_w * 6) - 3)  * view_h >>> 0);
					buf_32[y * view_w + x] = 0xFF0000FF;
				}

				view_ctx.putImageData(view_data, 0, 0, 0, 0, view_w, view_h);
				drawScene();
				out("Нормальное распределение " + count_random + " точек, функцией fastRandomInt + f_normal_v1(плотность распределения) по горизонтали(x).");
			}

			function random_f_x_y(){
				for(let i = 0; i < buf_32.length; i++){
					// Записываем пиксель в формате ABGR
					buf_32[i] = 0xFF000000;
				}

				//seed = 0x77777777;// Для сохранениЯ последовательности.
				random_density_f_x.init(f_x_y, 0, view_w, view_w);
				for(let i = 0; i < count_random; i++){
					let x = random_density_f_x();
					let y = fastRandomInt(view_h - 1);
					let n = buf_32[y * view_w + x] & 0xFF;
					n += 0x22;
					if(n > 0xFF)n = 0xFF;
					buf_32[y * view_w + x] = 0xFF000000 | (n << 16) | (n << 8) | n;
				}

				for(let x = 0; x < view_w; x++){
					let y = view_h - 1 - f_x_y(x);
					buf_32[y * view_w + x] = 0xFF0000FF;
				}

				view_ctx.putImageData(view_data, 0, 0, 0, 0, view_w, view_h);
				drawScene();
				out("Распределение под 45 градусов " + count_random + " точек, функцией fastRandomInt + f_x_y(плотность распределения) по горизонтали(x).");
			}

			function random_f_damped_sine(){
				for(let i = 0; i < buf_32.length; i++){
					// Записываем пиксель в формате ABGR
					buf_32[i] = 0xFF000000;
				}

				//seed = 0x77777777;// Для сохранениЯ последовательности.
				random_density_f_x.init(f_damped_sine, 0, 5, view_w);//от 0 до 5
				for(let i = 0; i < count_random; i++){
					let x = random_density_f_x();
					let y = fastRandomInt(view_h - 1);
					let n = buf_32[y * view_w + x] & 0xFF;
					n += 0x22;
					if(n > 0xFF)n = 0xFF;
					buf_32[y * view_w + x] = 0xFF000000 | (n << 16) | (n << 8) | n;
				}

				for(let x = 0; x < view_w; x++){
					//от 0 до 5
					let y = view_h - (f_damped_sine(x / view_w * 5) * view_h >>> 0);
					buf_32[y * view_w + x] = 0xFF0000FF;
				}

				view_ctx.putImageData(view_data, 0, 0, 0, 0, view_w, view_h);
				drawScene();
				out("Распределение затухающая синусоида " + count_random + " точек, функцией fastRandomInt + f_damped_sine(плотность распределения) по горизонтали(x).");
			}

			function random_f_impulse_response(){
				for(let i = 0; i < buf_32.length; i++){
					// Записываем пиксель в формате ABGR
					buf_32[i] = 0xFF000000;
				}

				//seed = 0x77777777;// Для сохранениЯ последовательности.
				random_density_f_x.init(f_impulse_response, 0, 3, view_w);//от 0 до 3
				for(let i = 0; i < count_random; i++){
					let x = random_density_f_x();
					let y = fastRandomInt(view_h - 1);
					let n = buf_32[y * view_w + x] & 0xFF;
					n += 0x22;
					if(n > 0xFF)n = 0xFF;
					buf_32[y * view_w + x] = 0xFF000000 | (n << 16) | (n << 8) | n;
				}

				for(let x = 0; x < view_w; x++){
					//с 0 до 3
					let y = view_h - (f_impulse_response(x / view_w * 3)  * view_h >>> 0);
					buf_32[y * view_w + x] = 0xFF0000FF;
				}

				view_ctx.putImageData(view_data, 0, 0, 0, 0, view_w, view_h);
				drawScene();
				out("Распределение импульс " + count_random + " точек, функцией fastRandomInt + f_impulse_response(плотность распределения) по горизонтали(x).");
			}

			function random_f_piecewise(){
				for(let i = 0; i < buf_32.length; i++){
					// Записываем пиксель в формате ABGR
					buf_32[i] = 0xFF000000;
				}

				//seed = 0x77777777;// Для сохранениЯ последовательности.
				random_density_f_x.init(f_piecewise, 0, 6, view_w);//от 0 до 6
				for(let i = 0; i < count_random; i++){
					let x = random_density_f_x();
					let y = fastRandomInt(view_h - 1);
					let n = buf_32[y * view_w + x] & 0xFF;
					n += 0x22;
					if(n > 0xFF)n = 0xFF;
					buf_32[y * view_w + x] = 0xFF000000 | (n << 16) | (n << 8) | n;
				}

				for(let x = 0; x < view_w; x++){
					//с 0 до 6
					let y = view_h - (f_piecewise(x / view_w * 6)  * view_h >>> 0);
					buf_32[y * view_w + x] = 0xFF0000FF;
				}

				view_ctx.putImageData(view_data, 0, 0, 0, 0, view_w, view_h);
				drawScene();
				out("Распределение ломаная " + count_random + " точек, функцией fastRandomInt + f_piecewise(плотность распределения) по горизонтали(x).");
			}

			function test(){
				out("test");
			}
			function out(text){
				document.getElementById("out").innerHTML = text;
			}
			function info(text){
				document.getElementById("info").innerHTML = text;
			}
		</script>
	</head>
	<body>
		<div id="test_random"></div>
		<input type="button" onclick="test()" value="test" />
		<input type="button" onclick="random()" value="random" />
		<input type="button" onclick="fast_random()" value="fast_random" />
		<input type="button" onclick="random_f_normal_v1()" value="random_f_normal_v1" />
		<input type="button" onclick="random_f_x_y()" value="random_f_x_y" />
		<input type="button" onclick="random_f_damped_sine()" value="random_f_damped_sine" />
		<input type="button" onclick="random_f_impulse_response()" value="random_f_impulse_response" />
		<input type="button" onclick="random_f_piecewise()" value="random_f_piecewise" />
		<br>
		Количество итераций рандома <input type="number" id="count_random" step="50000" min="0" value="100000">
		<br>
		<span id="info">info</span>
		<br>
		<span id="out">out</span>
	</body>
</html>
